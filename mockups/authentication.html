<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Authentication Hub - ReqGit</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Hanken+Grotesk:wght@600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-primary": "#b4c5ff",
                    "secondary-fixed-dim": "#b7c8e1",
                    "on-secondary-fixed-variant": "#38485d",
                    "surface-container-lowest": "#ffffff",
                    "outline": "#737686",
                    "secondary-fixed": "#d3e4fe",
                    "surface-container": "#ededf9",
                    "primary-container": "#2563eb",
                    "on-tertiary-fixed": "#360f00",
                    "on-secondary": "#ffffff",
                    "surface-container-highest": "#e1e2ed",
                    "on-background": "#191b23",
                    "surface-dim": "#d9d9e5",
                    "surface-variant": "#e1e2ed",
                    "on-secondary-container": "#54647a",
                    "tertiary-fixed-dim": "#ffb596",
                    "background": "#faf8ff",
                    "on-error": "#ffffff",
                    "tertiary-container": "#bc4800",
                    "inverse-surface": "#2e3039",
                    "surface-container-low": "#f3f3fe",
                    "on-primary-fixed": "#00174b",
                    "primary-fixed": "#dbe1ff",
                    "secondary": "#505f76",
                    "primary-fixed-dim": "#b4c5ff",
                    "on-primary-fixed-variant": "#003ea8",
                    "tertiary": "#943700",
                    "on-error-container": "#93000a",
                    "on-tertiary": "#ffffff",
                    "surface": "#faf8ff",
                    "inverse-on-surface": "#f0f0fb",
                    "surface-bright": "#faf8ff",
                    "on-surface": "#191b23",
                    "on-tertiary-container": "#ffede6",
                    "on-secondary-fixed": "#0b1c30",
                    "on-surface-variant": "#434655",
                    "error": "#ba1a1a",
                    "surface-container-high": "#e7e7f3",
                    "surface-tint": "#0053db",
                    "outline-variant": "#c3c6d7",
                    "secondary-container": "#d0e1fb",
                    "error-container": "#ffdad6",
                    "primary": "#004ac6",
                    "on-tertiary-fixed-variant": "#7d2d00",
                    "on-primary": "#ffffff",
                    "on-primary-container": "#eeefff",
                    "tertiary-fixed": "#ffdbcd"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "0.25rem",
                    "container-max": "1280px",
                    "base": "4px",
                    "lg": "1.5rem",
                    "gutter": "1rem",
                    "sm": "0.5rem",
                    "md": "1rem",
                    "xl": "2.5rem"
            },
            "fontFamily": {
                    "button": ["Inter"],
                    "body-sm": ["Inter"],
                    "title-md": ["Hanken Grotesk"],
                    "headline-lg-mobile": ["Hanken Grotesk"],
                    "display-lg": ["Hanken Grotesk"],
                    "label-mono": ["JetBrains Mono"],
                    "body-lg": ["Inter"],
                    "headline-lg": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "button": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-mono": ["13px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn.active { 
            border-bottom-color: #004ac6; 
            color: #004ac6;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-md">
<!-- Suppressed TopNavBar/SideNavBar as this is a linear/transactional screen -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-xl">
<div class="text-center mb-lg">
<h1 class="font-headline-lg text-headline-lg text-primary mb-sm md:block hidden">ReqGit</h1>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-sm block md:hidden">ReqGit</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enterprise Requirements Management</p>
</div>
<!-- Main Auth Container -->
<div id="auth-container">
<!-- Tabs -->
<div class="flex border-b border-outline-variant mb-lg">
<button class="tab-btn active flex-1 pb-sm text-center font-button text-button text-on-surface-variant border-b-2 border-transparent hover:text-primary transition-colors" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
<button class="tab-btn flex-1 pb-sm text-center font-button text-button text-on-surface-variant border-b-2 border-transparent hover:text-primary transition-colors" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
</div>
<!-- Sign In View -->
<div class="tab-content active" id="view-signin">
<form class="space-y-md" onsubmit="event.preventDefault();">
<div>
<label class="block font-label-mono text-label-mono text-on-surface mb-xs">Email</label>
<input class="w-full px-sm py-sm rounded border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-fixed bg-surface-container-lowest font-body-sm text-body-sm text-on-surface outline-none transition-all" placeholder="name@company.com" type="email"/>
</div>
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-mono text-label-mono text-on-surface">Password</label>
<button class="font-body-sm text-body-sm text-primary hover:text-on-primary-fixed-variant transition-colors" onclick="showForgotPassword()" type="button">Forgot Password?</button>
</div>
<input class="w-full px-sm py-sm rounded border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-fixed bg-surface-container-lowest font-body-sm text-body-sm text-on-surface outline-none transition-all" placeholder="••••••••" type="password"/>
</div>
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-button text-button py-sm rounded transition-colors mt-md" type="submit">Log In</button>
</form>
</div>
<!-- Sign Up View -->
<div class="tab-content" id="view-signup">
<form class="space-y-md" onsubmit="event.preventDefault();">
<div>
<label class="block font-label-mono text-label-mono text-on-surface mb-xs">Full Name</label>
<input class="w-full px-sm py-sm rounded border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-fixed bg-surface-container-lowest font-body-sm text-body-sm text-on-surface outline-none transition-all" placeholder="Jane Doe" type="text"/>
</div>
<div>
<label class="block font-label-mono text-label-mono text-on-surface mb-xs">Email</label>
<input class="w-full px-sm py-sm rounded border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-fixed bg-surface-container-lowest font-body-sm text-body-sm text-on-surface outline-none transition-all" placeholder="name@company.com" type="email"/>
</div>
<div>
<label class="block font-label-mono text-label-mono text-on-surface mb-xs">Password</label>
<input class="w-full px-sm py-sm rounded border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-fixed bg-surface-container-lowest font-body-sm text-body-sm text-on-surface outline-none transition-all" placeholder="••••••••" type="password"/>
</div>
<div>
<label class="block font-label-mono text-label-mono text-on-surface mb-xs">Confirm Password</label>
<input class="w-full px-sm py-sm rounded border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-fixed bg-surface-container-lowest font-body-sm text-body-sm text-on-surface outline-none transition-all" placeholder="••••••••" type="password"/>
</div>
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-button text-button py-sm rounded transition-colors mt-md" type="submit">Register</button>
</form>
</div>
</div>
<!-- Forgot Password View -->
<div class="hidden" id="forgot-password-container">
<div class="mb-lg">
<h2 class="font-title-md text-title-md text-on-surface mb-xs">Reset Password</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Enter your email address and we'll send you a link to reset your password.</p>
</div>
<form class="space-y-md" onsubmit="event.preventDefault();">
<div>
<label class="block font-label-mono text-label-mono text-on-surface mb-xs">Email</label>
<input class="w-full px-sm py-sm rounded border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary-fixed bg-surface-container-lowest font-body-sm text-body-sm text-on-surface outline-none transition-all" placeholder="name@company.com" type="email"/>
</div>
<button class="w-full bg-primary hover:bg-on-primary-fixed-variant text-on-primary font-button text-button py-sm rounded transition-colors mt-md" type="submit">Send Reset Link</button>
<button class="w-full flex items-center justify-center gap-xs font-button text-button text-on-surface-variant hover:text-primary transition-colors mt-sm" onclick="showAuthContainer()" type="button">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                    Back to Login
                </button>
</form>
</div>
</main>
<script>
        function switchTab(tabId) {
            // Hide all views
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            // Remove active state from all tabs
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            // Show selected view
            document.getElementById(`view-${tabId}`).classList.add('active');
            // Add active state to selected tab
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        function showForgotPassword() {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('forgot-password-container').classList.remove('hidden');
        }

        function showAuthContainer() {
            document.getElementById('forgot-password-container').classList.add('hidden');
            document.getElementById('auth-container').classList.remove('hidden');
            switchTab('signin');
        }
    </script>
</body></html>
