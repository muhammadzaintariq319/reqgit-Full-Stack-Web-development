<body class="bg-surface font-body-sm text-on-surface antialiased flex flex-col min-h-screen">
<main class="flex-grow flex items-center justify-center p-md md:p-lg lg:p-xl w-full max-w-container-max mx-auto">
<div class="w-full max-w-[440px] bg-surface-container-lowest border border-outline-variant rounded-lg p-lg md:p-xl shadow-sm hover:shadow-md transition-shadow duration-200">
<div class="mb-lg text-center">
<h1 class="font-headline-lg text-headline-lg text-primary mb-xs">ReqGit</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Create your account to start managing specifications.</p>
</div>
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-button text-button text-on-surface" for="fullName">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant" data-icon="person">person</span>
</div>
<input class="w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-outline rounded text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors font-body-sm text-body-sm" id="fullName" name="fullName" placeholder="Jane Doe" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-button text-button text-on-surface" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant" data-icon="mail">mail</span>
</div>
<input class="w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-outline rounded text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors font-body-sm text-body-sm" id="email" name="email" placeholder="jane.doe@example.com" required="" type="email"/>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-button text-button text-on-surface" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant" data-icon="lock">lock</span>
</div>
<input class="w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-outline rounded text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors font-body-sm text-body-sm" id="password" minlength="8" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant text-xs mt-1">Must be at least 8 characters long.</p>
</div>
<div class="flex flex-col gap-xs">
<label class="font-button text-button text-on-surface" for="confirmPassword">Confirm Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-on-surface-variant" data-icon="lock_reset">lock_reset</span>
</div>
<input class="w-full pl-xl pr-sm py-sm bg-surface-container-lowest border border-outline rounded text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors font-body-sm text-body-sm" id="confirmPassword" minlength="8" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<button class="w-full mt-sm py-sm px-md bg-primary text-on-primary rounded-lg font-button text-button hover:bg-primary-fixed-variant active:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex justify-center items-center gap-xs" type="submit">
                    Create Account
                    <span aria-hidden="true" class="material-symbols-outlined text-on-primary" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-lg pt-lg border-t border-outline-variant text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                    Already have an account? 
                    <a class="font-button text-button text-primary hover:text-primary-fixed-variant transition-colors underline-offset-2 hover:underline" href="#">Sign In</a>
</p>
</div>
</div>
</main>
</body></html>
